[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tano.page"
version = "0.1.0a2"
description = "Tano Markdown workspace protocol helpers: content hashes, short IDs and portable path classification."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zixi Wang" }]
keywords = ["tano", "markdown", "workspace", "protocol"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tano_page"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE", "pyproject.toml"]

name: Export reviewed Core
on:
  workflow_dispatch:
    inputs:
      core_tag:
        description: Locally validated stable Core tag (core-vX.Y.Z)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: core-export-${{ inputs.core_tag }}
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.core_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify tag, main ancestry and clean source
        env:
          CORE_TAG: ${{ inputs.core_tag }}
        run: |
          node scripts/version.mjs check --tag "$CORE_TAG"
          test "$(git rev-parse "$CORE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          test -z "$(git status --porcelain)"
      - run: npm ci && npm run core:export
      - name: Reject generated source drift
        run: node --input-type=module -e 'import fs from "node:fs"; if(JSON.parse(fs.readFileSync("artifacts/core/core-manifest.json")).dirty) throw Error("Core export is dirty");'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.core_tag }}
          path: artifacts/core/
          if-no-files-found: error
          retention-days: 30

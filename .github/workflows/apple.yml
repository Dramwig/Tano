name: Apple builds

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-desktop:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - run: npm run check
      - run: cargo fmt --manifest-path apps/client/src-tauri/Cargo.toml --check
      - run: npm run desktop:build -- --target aarch64-apple-darwin --bundles app --no-sign
      - uses: actions/upload-artifact@v4
        with:
          name: tano-macos-aarch64-app
          path: apps/client/src-tauri/target/**/bundle/macos/*.app
          if-no-files-found: error

  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - run: npm ci
      - run: npm run check
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - run: xcodebuild -version
      - run: npm run ios:init
      - run: npm run ios:build -- --target aarch64-sim --debug
      - uses: actions/upload-artifact@v4
        with:
          name: tano-ios-aarch64-simulator-app
          path: apps/client/src-tauri/gen/apple/build/arm64-sim/*.app
          if-no-files-found: error

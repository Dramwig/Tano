name: Tag reviewed release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tag-release
  cancel-in-progress: false
jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-automation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/release-plan.mjs check
      - uses: ./.github/actions/release-token
        id: identity
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.RELEASE_AUTOMATION_TOKEN }}
      - name: Create immutable tag after local validation
        env:
          GH_TOKEN: ${{ steps.identity.outputs.token }}
        run: node scripts/release-github.mjs tag

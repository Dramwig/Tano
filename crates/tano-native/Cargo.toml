[package]
name = "tano-native"
version = "0.7.0"
edition = "2021"
license = "MIT"
description = "Tano local filesystem, search and desktop host core"
include = ["src/**", "build.rs", "Cargo.toml", "LICENSE"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
notify = "8"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
base64 = "0.22"
percent-encoding = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["devtools"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
hmac = "0.12"
sha1 = "0.10"
keyring = { version = "3.6.3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["sync", "macros", "process", "io-util", "time", "net"] }
toml = "0.9"
tauri-plugin-updater = "2"
trash = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

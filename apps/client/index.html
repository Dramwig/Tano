<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f2" />
    <meta
      name="description"
      content="Tano / 同页 — 人与 Agent，在同一页工作。属于你的 Markdown 工作空间。"
    />
    <title>Tano / 同页</title>
    <link rel="icon" type="image/svg+xml" href="/favicon-green.svg?v=3" />
    <style>
      :root { color-scheme: light; background: #f7f7f2; }
      body { margin: 0; }
      .tano-startup {
        box-sizing: border-box;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 32px;
        background: #f7f7f2;
        color: #252820;
        font: 14px/1.6 system-ui, sans-serif;
        text-align: center;
      }
      .tano-startup img { width: 36px; height: 36px; }
      .tano-startup h1 { margin: 0; font-size: 18px; font-weight: 600; }
      .tano-startup p { margin: 0; max-width: 560px; overflow-wrap: anywhere; }
      .tano-startup-detail { color: #a3362c; white-space: pre-wrap; }
      .tano-startup button {
        padding: 6px 16px;
        border: 1px solid #b6bcb0;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .tano-startup button:hover { background: #e9ece4; }
      .tano-startup [hidden] { display: none; }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) { color-scheme: dark; background: #1d201c; }
        :root:not([data-theme="light"]) .tano-startup { background: #1d201c; color: #e6e9e0; }
        :root:not([data-theme="light"]) .tano-startup-detail { color: #f0a59d; }
        :root:not([data-theme="light"]) .tano-startup button:hover { background: #30362c; }
      }
      :root[data-theme="dark"] { color-scheme: dark; background: #1d201c; }
      :root[data-theme="dark"] .tano-startup { background: #1d201c; color: #e6e9e0; }
      :root[data-theme="dark"] .tano-startup-detail { color: #f0a59d; }
      :root[data-theme="dark"] .tano-startup button:hover { background: #30362c; }
.tano-skeleton-bar { display: block; height: 12px; border-radius: 5px; background: currentColor; opacity: .09; animation: tano-skeleton-pulse 1.6s ease-in-out infinite; }
.tano-skeleton-bar:nth-child(2n) { animation-delay: .18s; }
.tano-skeleton-bar:nth-child(3n) { animation-delay: .36s; }
.tano-skeleton-shell { box-sizing: border-box; display: flex; flex: 1; width: 100%; min-height: 100%; background: var(--paper, #fff); color: var(--text, #252820); font: 14px/1.6 system-ui, sans-serif; }
.tano-skeleton-sidebar { box-sizing: border-box; flex: 0 0 240px; display: flex; flex-direction: column; gap: 24px; padding: 32px 26px; border-right: 1px solid var(--line, #e8e9e6); }
.tano-skeleton-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; color: var(--green, #397d54); font-size: 23px; font-weight: 650; }
.tano-skeleton-brand img { width: 38px; height: 38px; }
.tano-skeleton-sidebar .tano-skeleton-bar { height: 20px; width: 80%; }
.tano-skeleton-sidebar-bottom { margin-top: auto; display: grid; gap: 24px; padding-top: 48px; }
.tano-skeleton-content { box-sizing: border-box; flex: 1; min-width: 0; padding: 42px 32px; background: var(--surface, #f5f6f7); }
.tano-skeleton-title { height: 30px; width: 180px; margin-bottom: 18px; }
.tano-skeleton-subtitle { width: 38%; margin-bottom: 32px; }
.tano-skeleton-toolbar { height: 40px; width: 48%; margin-bottom: 24px; }
.tano-skeleton-row { display: flex; align-items: center; gap: 20px; padding: 24px 18px; border-bottom: 1px solid var(--line, #e8e9e6); }
.tano-skeleton-row .tano-skeleton-bar { flex: 1; }
.tano-skeleton-row .tano-skeleton-bar:first-child { flex: 2; }
.tano-skeleton-list { display: grid; gap: 20px; padding: 20px; }
.tano-skeleton-list .tano-skeleton-bar:last-child { width: 65%; }
.tano-skeleton-document { box-sizing: border-box; width: min(100%, 860px); margin: 0 auto; padding: 48px 32px; display: grid; align-content: start; gap: 22px; }
.tano-skeleton-document .tano-skeleton-bar:first-child { width: 45%; height: 32px; margin-bottom: 24px; }
.tano-skeleton-document .tano-skeleton-bar:nth-child(4n) { width: 72%; margin-bottom: 20px; }
.tano-skeleton-status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@keyframes tano-skeleton-pulse { 50% { opacity: .18; } }
:root[data-theme="dark"] .tano-skeleton-shell { --paper: #1d201c; --surface: #232622; --text: #e6e9e0; --line: #343a32; }
@media (prefers-reduced-motion: reduce) { .tano-skeleton-bar { animation: none; } }
@media (max-width: 760px) {
  .tano-skeleton-shell { flex-direction: column; }
  .tano-skeleton-sidebar { flex: 0 0 auto; padding: 20px 16px; flex-direction: row; flex-wrap: wrap; gap: 16px; border-right: 0; border-bottom: 1px solid var(--line, #e8e9e6); }
  .tano-skeleton-brand { width: 100%; margin-bottom: 8px; }
  .tano-skeleton-sidebar > .tano-skeleton-bar { width: 24%; }
  .tano-skeleton-sidebar-bottom { display: none; }
  .tano-skeleton-content { padding: 28px 16px; }
}

.tano-startup { height: 100dvh; padding: 0; gap: 0; align-items: stretch; justify-content: flex-start; text-align: left; }
.tano-startup > .tano-skeleton-shell { min-height: 0; }
.tano-startup > button, .tano-startup-detail { margin: 16px 32px; }
.tano-startup[aria-busy="false"] { padding: 32px; justify-content: center; align-items: center; }
    </style>
  </head>
  <body>
    <div id="app">
      <main id="tano-startup" class="tano-startup" aria-busy="true">
<div class="tano-skeleton-shell" aria-hidden="true">
  <aside class="tano-skeleton-sidebar"><div class="tano-skeleton-brand"><img src="/favicon-green.svg?v=3" alt="" />同页</div><span class="tano-skeleton-bar"></span><span class="tano-skeleton-bar"></span><span class="tano-skeleton-bar"></span><div class="tano-skeleton-sidebar-bottom"><span class="tano-skeleton-bar"></span><span class="tano-skeleton-bar"></span></div></aside>
  <div class="tano-skeleton-content"><span class="tano-skeleton-bar tano-skeleton-title"></span><span class="tano-skeleton-bar tano-skeleton-subtitle"></span><span class="tano-skeleton-bar tano-skeleton-toolbar"></span><div class="tano-skeleton-row"><span class="tano-skeleton-bar"></span><span class="tano-skeleton-bar"></span><span class="tano-skeleton-bar"></span><span class="tano-skeleton-bar"></span></div><div class="tano-skeleton-row"><span class="tano-skeleton-bar"></span><span class="tano-skeleton-bar"></span><span class="tano-skeleton-bar"></span><span class="tano-skeleton-bar"></span></div><div class="tano-skeleton-row"><span class="tano-skeleton-bar"></span><span class="tano-skeleton-bar"></span><span class="tano-skeleton-bar"></span><span class="tano-skeleton-bar"></span></div><div class="tano-skeleton-row"><span class="tano-skeleton-bar"></span><span class="tano-skeleton-bar"></span><span class="tano-skeleton-bar"></span><span class="tano-skeleton-bar"></span></div></div>
</div>
        <p id="tano-startup-status" class="tano-skeleton-status" role="status">正在打开同页...</p>
        <p id="tano-startup-detail" class="tano-startup-detail" hidden></p>
        <button id="tano-startup-retry" type="button" hidden>重新加载</button>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
